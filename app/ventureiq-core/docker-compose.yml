services:
  postgres:
    image: postgres:18.6-alpine3.23
    container_name: ventureiq_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ventureiq
      POSTGRES_PASSWORD: ventureiq1570
      POSTGRES_DB: ventureiq_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    container_name: ventureiq_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data: